version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # Major version bumps are deliberate framework upgrades (e.g. React 18→19,
    # Next 14→15), not auto-PRs — they break peer deps and fail CI. Security
    # updates are unaffected and can still bump majors when needed for a fix.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keep SHA-pinned GitHub Actions current (pinning without updates rots; Dependabot
  # bumps the SHA + version comment together with changelogs). Supports the ICT
  # supply-chain control (ISO A.5.21) flagged by CodeQL actions/unpinned-tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
