name: Workflow Health Guard

# Detects and auto-remediates silently broken automation:
# - re-enables workflows GitHub disabled for 60-day repo inactivity
# - keepalive-pings scheduled workflows so the 60-day clock never expires
# - flags manually disabled or stale-scheduled workflows via a deduped issue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
      - name: Check workflow health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/workflow-health.js
