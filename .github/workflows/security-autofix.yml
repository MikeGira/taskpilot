name: Security autofix

# Closes the loop that used to be manual: a monitor reported vulnerabilities, a human verified the
# version numbers, applied the fix, and opened a PR. scripts/security-autofix.js does all of that
# from machine-read data, and the normal CI gates judge the result.
#
# Runs before the 09:00 UTC monitors so that by the time a report is generated, the fix is already
# open as a PR and the report can say so instead of assigning homework.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: security-autofix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    name: Remediate production dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR pushed with the default GITHUB_TOKEN does not start CI, so its required checks
          # never report and auto-merge can never fire. AUTOFIX_PAT (fine-grained, contents +
          # pull-requests write on this repo only) is what makes the PR self-validating; without
          # it the run still opens the PR, it just needs its checks kicked by hand.
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - name: Plan, verify and open the remediation
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/security-autofix.js
