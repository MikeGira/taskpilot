name: Dependabot CI triage

# When CI fails on a Dependabot branch, comment the failing run link on the PR
# so it is immediately actionable (e.g. from GitHub Mobile) instead of waiting
# for the daily security sweep email. Metadata-only: never checks out PR code.
on:
  workflow_run:
    workflows: ["CI — Security + Build + Deploy Check"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    name: Comment failing run on Dependabot PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Find open PR for the branch and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH, nothing to do."
            exit 0
          fi
          gh pr comment "$pr" --repo "$REPO" --body "Automated triage: CI failed on this Dependabot branch, blocking auto-merge until fixed. Failing run: $RUN_URL"
