name: CI — Security + Build + Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC — dependency audit
  workflow_dispatch:       # On-demand run; gitleaks does a full-history scan on this event

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── 0. Dependency audit (runs on schedule + PRs) ────────────────────────────
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── 0b. Workflow validation ─────────────────────────────────────────────────
  # Catches invalid workflow YAML (bad indentation, unknown trigger events, broken
  # expressions) on the PR — before it reaches main as a silent 0-second startup failure.
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          # shellcheck disabled to scope this gate to workflow syntax/schema validation.
          ./actionlint -color -shellcheck=

  # ── 1. Secret detection ─────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Static analysis ──────────────────────────────────────────────────────
  # CodeQL is free on public repos. Re-disable (add `if: false`) if/when repo goes private
  # and GitHub Advanced Security is not available.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Analyse both detected languages. Omitting `actions` while GitHub detects
        # workflow files is what surfaces the "code scanning configuration error".
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

  # ── 3. Build + TypeScript check ─────────────────────────────────────────────
  build:
    name: Build + TypeCheck
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js build (with placeholder env vars)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://taskpilot.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder-not-a-secret
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder

  # ── 4. Smoke test production (push to main only) ────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [secret-scan, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Test homepage returns 200
        run: |
          SITE="${{ secrets.SITE_URL || 'https://taskpilot.vercel.app' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠ Site returned $STATUS — may still be deploying"
          else
            echo "✅ Site returning 200 OK"
          fi
      - name: Verify security headers
        run: |
          SITE="${{ secrets.SITE_URL || 'https://taskpilot.vercel.app' }}"
          curl -sI "$SITE/" | grep -i "x-content-type-options" && echo "✅ X-Content-Type-Options present" || echo "⚠ Header missing"
          curl -sI "$SITE/" | grep -i "x-frame-options" && echo "✅ X-Frame-Options present" || echo "⚠ Header missing"
          curl -sI "$SITE/" | grep -i "strict-transport-security" && echo "✅ HSTS present" || echo "⚠ Header missing"
