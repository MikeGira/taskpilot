name: CI — Security + Build + Deploy Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC — dependency audit
  workflow_dispatch:       # On-demand run; gitleaks does a full-history scan on this event

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── 0. Dependency audit (runs on schedule + PRs) ────────────────────────────
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      # The Node major is declared once, in engines.node, and every workflow above defers to
      # it. This proves that declaration still names a runtime Vercel will build, and that
      # nothing has re-hardcoded a copy that can drift. See scripts/lib/node-runtime.js.
      - run: node scripts/check-node-runtime.js
      # Scope- and expiry-aware gate (scripts/audit-gate.js). A plain `npm audit
      # --audit-level=high` is one boolean over every dependency, so a lint-toolchain
      # advisory with no compatible fix red-lines every branch — including the Dependabot
      # security PRs that fix the genuinely reachable findings. See the module header.
      - run: node scripts/audit-gate.js

  # ── 0b. Workflow validation ─────────────────────────────────────────────────
  # Catches invalid workflow YAML (bad indentation, unknown trigger events, broken
  # expressions) on the PR — before it reaches main as a silent 0-second startup failure.
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          # shellcheck disabled to scope this gate to workflow syntax/schema validation.
          ./actionlint -color -shellcheck=

  # ── 1. Secret detection ─────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Static analysis ──────────────────────────────────────────────────────
  # CodeQL is free on public repos. Re-disable (add `if: false`) if/when repo goes private
  # and GitHub Advanced Security is not available.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Analyse both detected languages. Omitting `actions` while GitHub detects
        # workflow files is what surfaces the "code scanning configuration error".
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  # ── 3. Build + TypeScript check ─────────────────────────────────────────────
  build:
    name: Build + TypeCheck
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js build (with placeholder env vars)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://taskpilot.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder-not-a-secret
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder

  # ── 3a. Unit + integration tests (Vitest) with coverage gate ────────────────
  # Fast base of the test pyramid: lib primitives and the Stripe webhook handler.
  # Coverage thresholds live in vitest.config.mts and are scoped to the modules under
  # test, so the percentage is meaningful rather than diluted by untested files.
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 7

  # ── 3b. End-to-end tests (Playwright) ───────────────────────────────────────
  # Runs the specs in tests/e2e against the production build, started with the same
  # placeholder env vars as the build job. The generator spec stubs /api/generate, so
  # no real Anthropic key, spend, or network egress is needed.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Next.js build
        run: npm run build
      - name: Run E2E specs
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── 4. Smoke test production (push to main only) ────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [secret-scan, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Test homepage returns 200
        run: |
          SITE="${{ secrets.SITE_URL || 'https://taskpilot.vercel.app' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠ Site returned $STATUS — may still be deploying"
          else
            echo "✅ Site returning 200 OK"
          fi
      - name: Verify security headers
        run: |
          SITE="${{ secrets.SITE_URL || 'https://taskpilot.vercel.app' }}"
          curl -sI "$SITE/" | grep -i "x-content-type-options" && echo "✅ X-Content-Type-Options present" || echo "⚠ Header missing"
          curl -sI "$SITE/" | grep -i "x-frame-options" && echo "✅ X-Frame-Options present" || echo "⚠ Header missing"
          curl -sI "$SITE/" | grep -i "strict-transport-security" && echo "✅ HSTS present" || echo "⚠ Header missing"
