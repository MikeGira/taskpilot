name: CodeQL Visibility Guard

# GitHub has no workflow event that fires on a public → private visibility change,
# so this runs on a monthly schedule (safety net) plus manual dispatch. CodeQL
# cannot run on a private repo without GitHub Advanced Security, so when the repo
# is private this opens a PR to disable the CodeQL job in ci.yml.
on:
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    name: Disable CodeQL if repo is private
    runs-on: ubuntu-latest
    steps:
      - name: Check repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIS=$(gh api "repos/${{ github.repository }}" --jq '.visibility')
          echo "visibility=$VIS" >> "$GITHUB_OUTPUT"
          echo "Repo is: $VIS"

      - name: Repo is public — nothing to do
        if: steps.vis.outputs.visibility == 'public'
        run: echo "Repo is public. CodeQL stays enabled."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.vis.outputs.visibility == 'private'

      - name: Check if CodeQL already disabled
        if: steps.vis.outputs.visibility == 'private'
        id: already
        run: |
          if grep -q "if: false" .github/workflows/ci.yml; then
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "disabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR to disable CodeQL
        if: steps.vis.outputs.visibility == 'private' && steps.already.outputs.disabled == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            Repo visibility was changed to private. CodeQL requires GitHub Advanced Security on private repos (paid).

            This PR adds `if: false` to the CodeQL job in `.github/workflows/ci.yml` to prevent failed scans.

            **To re-enable later:** remove `if: false` from the CodeQL job when GitHub Pro / Advanced Security is active.
        run: |
          BRANCH="chore/disable-codeql-repo-is-private"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i '/    name: CodeQL Analysis/a\    if: false' .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m "chore: disable CodeQL — repo changed to private" \
                     -m "GitHub Advanced Security is required for CodeQL on private repos. Re-enable by removing 'if: false' when GitHub Pro is active." \
                     -m "[skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: disable CodeQL — repo is now private" \
            --body "$PR_BODY" \
            --base main
