name: DAST (ZAP Baseline)

# Dynamic analysis: scans the RUNNING app, complementing CodeQL (which only sees
# source). Runs against a production build served on the runner rather than against
# taskpilot.makinyx.com — scanning production would generate load, trip rate limits,
# and pollute analytics, and the security headers under test come from next.config.mjs
# so a local build is representative of what ships.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC — catches drift from dependency updates
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # scheduled runs file findings as an issue

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 60s"
          exit 1

      # The action runs ZAP with --network=host, so localhost on the runner is reachable
      # from inside the container.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          # -a includes alpha passive rules; -j runs the AJAX spider so client-rendered
          # routes are actually reached (this is a React app — without it the scan only
          # sees the initial HTML).
          cmd_options: '-a -j'
          # Any alert not explicitly triaged in .zap/rules.tsv fails the build.
          fail_action: true
          # Issue-per-run is useful for unattended scheduled runs; on a PR the check
          # status and the uploaded report are the signal, so don't open issues.
          allow_issue_writing: ${{ github.event_name == 'schedule' }}
          issue_title: 'DAST: ZAP baseline findings'
          artifact_name: zap-baseline-report
