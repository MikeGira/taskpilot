name: Credential expiry guard

# A fine-grained PAT cannot be extended, and an expired one is revoked permanently — so the
# failure mode is several workflows breaking on an ordinary day for a reason nobody connects to a
# token issued a year earlier. This runs weekly, warns 45 days out, escalates at 14, and also
# probes whether each token still authenticates at all.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check credential expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
      - name: Evaluate declared expiry dates and probe token liveness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Probed, never printed: the script only ever reports whether it authenticated.
          AUTOFIX_PAT: ${{ secrets.AUTOFIX_PAT }}
        run: node scripts/check-credential-expiry.js
