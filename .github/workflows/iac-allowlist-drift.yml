name: IaC Allowlist Drift Check

# Grounding L1 staleness control. Re-verifies the region/provider-version allowlists in
# src/lib/iac-allowlists.ts against live public provider sources and opens a deduped tracking
# issue on drift (auto-closed when resolved). Quarterly is enough — catalogues move a few times
# a year, and every use of the list is advisory, so lag can only under-warn, never mis-block.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 1 1,4,7,10 *'  # noon UTC on the 1st of Jan, Apr, Jul, Oct

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: Check IaC allowlist drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run drift check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/check-iac-allowlist-drift.js
