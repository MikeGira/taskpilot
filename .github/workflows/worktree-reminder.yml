name: Git Worktree Setup Reminder

# Fires when a stable/release/long-lived branch is created — a signal that the
# solo linear workflow is evolving and Git worktrees become useful.
# NOTE: there is no GitHub Actions trigger for "collaborator added" (the `member`
# webhook is not a valid workflow trigger), so that path was removed.
on:
  create:

permissions:
  issues: write

jobs:
  stable-branch-created:
    name: Suggest worktree setup (stable/release branch)
    if: |
      github.event_name == 'create' &&
      github.ref_type == 'branch' &&
      (
        github.ref_name == 'stable' ||
        startsWith(github.ref_name, 'release/') ||
        startsWith(github.ref_name, 'v') ||
        github.ref_name == 'nextjs-15' ||
        startsWith(github.ref_name, 'nextjs')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          BODY: |
            Branch `${{ github.ref_name }}` was just created. If you plan to maintain this alongside `main`, Git Worktrees will make your workflow significantly smoother.

            ## Why
            Without worktrees, switching between `main` and `${{ github.ref_name }}` requires stashing or committing half-done work. With a worktree, both branches live in separate folders — you `cd` between them instantly.

            ## How to set up
            ```bash
            # Check out this branch into a sibling folder without touching your current working directory
            git worktree add ../taskpilot-${{ github.ref_name }} ${{ github.ref_name }}

            # Now you can work in both simultaneously:
            # ../taskpilot/   ← main
            # ../taskpilot-branch/   ← the new branch

            # Remove when the branch is merged
            git worktree remove ../taskpilot-${{ github.ref_name }}
            ```

            Open Claude Code and say: **"Set up Git Worktrees for this project"** to implement it.
        run: |
          gh issue create \
            --title "Consider Git Worktrees — long-lived branch '$REF' created" \
            --label "enhancement" \
            --body "$BODY"
