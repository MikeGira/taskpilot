[extend]
useDefault = true

[[allowlists]]
description = "Ignore placeholder values in example and documentation files"
paths = [
  ".env.example",
  "*.example",
  "setup-guide.md",
  "README.md",
  "CLAUDE.md",
]

[[allowlists]]
description = "Ignore placeholder secrets used as CI/CD env var examples — these are not real credentials"
regexes = ["(?i)placeholder"]
regexTarget = "secret"
