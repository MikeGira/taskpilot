[extend]
useDefault = true

# Allowlist 1 — example and documentation files hold placeholder values, not real secrets.
# NOTE: gitleaks `paths` entries are regexes, NOT globs. `*.example` is an invalid regex
# (missing argument to `*`) and panics on gitleaks ≥ 8.30; use an anchored regex instead.
[[allowlists]]
description = "Ignore placeholder values in example and documentation files"
paths = [
  '''\.env\.example$''',
  '''.*\.example$''',
  '''setup-guide\.md$''',
  '''README\.md$''',
  '''CLAUDE\.md$''',
]

# Allowlist 2 — CI build steps inject fake JWTs that literally end in ".placeholder".
# gitleaks captures only the high-entropy token as the "secret" (excluding the
# ".placeholder" suffix), so a regexTarget="secret" rule never sees the word.
# Target the full match so the placeholder stub is recognised; a real leak — which
# would not contain "placeholder" on its match — is still caught.
[[allowlists]]
description = "Ignore placeholder env values used as CI build-step stubs — not real credentials"
regexTarget = "match"
regexes = ['''(?i)placeholder''']

# GitHub is rolling out a stateless App installation token, ghs_<appid>_<jwt>, around 520
# characters and containing dots and underscores. The bundled github-app-token rule is
# ghs_[0-9a-zA-Z]{36}, so the underscore straight after the app ID stops it matching and a
# leaked token in the new format walks through this gate in silence.
#
# Verified 2026-09-20 with a positive control: a seeded 493-character stateless token was
# missed by the default config while a 40-character legacy token in the same commit was caught,
# so the miss was the rule and not the harness. Regex is GitHub's own recommendation.
# https://github.blog/changelog/2026-04-24-notice-about-upcoming-new-format-for-github-app-installation-tokens/
[[rules]]
id = "github-app-token-stateless"
description = "GitHub App installation token (stateless ghs_<appid>_<jwt> format)"
regex = '''(?:ghu|ghs)_[A-Za-z0-9._-]{36,}'''
keywords = ["ghu_", "ghs_"]
entropy = 3.5

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''(?:ghu|ghs)_[xX]+''',
    '''(?:ghu|ghs)_(?:APPID|appid|example|EXAMPLE|placeholder)''',
  ]
